name: moment-grid-infra

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_DB: moment_grid
      POSTGRES_USER: moment_grid
      POSTGRES_PASSWORD: moment_grid_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moment-grid-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moment_grid
      MINIO_ROOT_PASSWORD: moment_grid_dev_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - moment-grid-minio:/data

volumes:
  moment-grid-postgres:
  moment-grid-minio:
